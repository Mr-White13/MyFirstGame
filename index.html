<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101522" />
    <title>NEON ESCAPE</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <h1 class="hud__title">NEON ESCAPE</h1>
        <div class="hud__stats">
          <div class="stat">
            <span class="stat__label">Level</span>
            <span class="stat__value" id="hud-level">1</span>
          </div>
          <div class="stat">
            <span class="stat__label">Moves</span>
            <span class="stat__value" id="hud-moves">0</span>
          </div>
          <div class="stat">
            <span class="stat__label">Arrows left</span>
            <span class="stat__value" id="hud-remaining">0</span>
          </div>
        </div>
      </header>

      <!-- Phaser mounts its canvas here; the board is sized to fit this area. -->
      <main id="board" class="board" aria-label="Puzzle board"></main>

      <footer class="controls">
        <button type="button" class="btn btn--outline" id="btn-restart">
          <span class="btn__icon" aria-hidden="true">↻</span> Restart
        </button>
      </footer>

      <div class="overlay" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
        <div class="overlay__card">
          <p class="overlay__eyebrow">Level 1</p>
          <h2 class="overlay__title" id="win-title">Level complete</h2>
          <p class="overlay__moves">
            <span class="overlay__moves-value" id="win-moves">0</span>
            <span class="overlay__moves-label">moves</span>
          </p>
          <button type="button" class="btn btn--solid" id="btn-play-again">Play again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
