<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101522" />
    <meta name="format-detection" content="telephone=no" />
    <title>NEON ESCAPE</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <h1 class="hud__title">NEON ESCAPE</h1>
        <dl class="hud__stats">
          <div class="stat">
            <dt class="stat__label">Level</dt>
            <dd class="stat__value" id="hud-level">1</dd>
          </div>
          <div class="stat stat--primary">
            <dt class="stat__label">Moves</dt>
            <dd class="stat__value" id="hud-moves" aria-live="polite">0</dd>
          </div>
          <div class="stat">
            <dt class="stat__label">Left</dt>
            <dd class="stat__value" id="hud-remaining">0</dd>
          </div>
        </dl>
      </header>

      <!-- Phaser mounts its canvas here; the board is sized to fit this area. -->
      <main id="board" class="board" aria-label="Puzzle board"></main>

      <footer class="controls">
        <button type="button" class="btn btn--ghost" id="btn-restart">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12a8 8 0 1 0 2.34-5.66" />
            <path d="M4 4v5h5" />
          </svg>
          Restart
        </button>
      </footer>

      <div class="overlay" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
        <div class="overlay__card">
          <div class="overlay__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
          </div>
          <p class="overlay__eyebrow" id="win-level">Level 1</p>
          <h2 class="overlay__title" id="win-title">Level complete</h2>
          <p class="overlay__moves">
            <span class="overlay__moves-value" id="win-moves">0</span>
            <span class="overlay__moves-label" id="win-moves-label">moves</span>
          </p>
          <p class="overlay__detail" id="win-cleared">All arrows cleared</p>
          <button type="button" class="btn btn--solid" id="btn-play-again">
            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12a8 8 0 1 0 2.34-5.66" />
              <path d="M4 4v5h5" />
            </svg>
            Play again
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
