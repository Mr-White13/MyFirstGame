<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- NEON ESCAPE logo mark: three neon arrows on a dotted grid, the cyan one
       breaking out through the top edge ("escaping"). Source for the app icon
       (scripts/generate-icons.py) and drawn inline on the intro screen. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b2540" />
      <stop offset="1" stop-color="#0b0f1a" />
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse" x="4" y="4">
      <circle cx="8" cy="8" r="1.3" fill="#9ba8bc" fill-opacity="0.28" />
    </pattern>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#tile)" />
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#dots)" />
  <rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="#27ddf5" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Glow layer (blurred copies), then the crisp arrows on top. -->
  <g filter="url(#glow)" opacity="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <path d="M34 92 V46 Q34 38 42 38 H62 Q70 38 70 30 V12" stroke="#27ddf5" />
    <path d="M92 30 V74 Q92 82 84 82 H58" stroke="#a855f7" />
    <path d="M50 62 H74" stroke="#ff5c8a" />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M34 92 V46 Q34 38 42 38 H62 Q70 38 70 30 V17" stroke="#27ddf5" />
    <path d="M92 30 V74 Q92 82 84 82 H62" stroke="#a855f7" />
    <path d="M50 62 H70" stroke="#ff5c8a" />
  </g>
  <!-- Arrowheads -->
  <path d="M70 1 L81 18 H59 Z" fill="#27ddf5" />
  <path d="M50 82 L64 71 V93 Z" fill="#a855f7" />
  <path d="M82 62 L68 52 V72 Z" fill="#ff5c8a" />
  <!-- Bright cores: the neon tube look of the in-game arrows. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M34 92 V46 Q34 38 42 38 H62 Q70 38 70 30 V19" />
    <path d="M92 30 V74 Q92 82 84 82 H64" />
    <path d="M50 62 H69" />
  </g>
  <!-- Tail sockets, as on the in-game arrows. -->
  <circle cx="34" cy="92" r="2" fill="#0b0f1a" />
  <circle cx="92" cy="30" r="2" fill="#0b0f1a" />
  <circle cx="50" cy="62" r="2" fill="#0b0f1a" />
</svg>
